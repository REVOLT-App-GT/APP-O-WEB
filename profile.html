<div class="edit-profile-container">
    <aside class="profile-nav">
        <button class="active">Información Pública</button>
        <button>Seguridad</button>
        <button>Pagos y Cobros</button>
    </aside>

    <main class="profile-form">
        <section class="form-group">
            <h3>Foto de Perfil</h3>
            <div class="avatar-upload">
                <img src="avatar-preview.jpg" id="imgPreview" alt="Avatar">
                <input type="file" id="fileInput" hidden>
                <button onclick="document.getElementById('fileInput').click()">Cambiar Foto</button>
            </div>
        </section>

        <section class="form-grid">
            <div class="input-box">
                <label>Nombre de Usuario</label>
                <input type="text" placeholder="@misael_pe">
            </div>
            <div class="input-box">
                <label>Especialidad</label>
                <select>
                    <option>Educación Física</option>
                    <option>Entrenamiento Funcional</option>
                    <option>Neuroeducación</option>
                </select>
            </div>
            <div class="input-box full-width">
                <label>Biografía</label>
                <textarea rows="4" placeholder="Cuéntale a la comunidad sobre tu experiencia..."></textarea>
            </div>
        </section>

        <div class="form-actions">
            <button class="btn-secondary">Cancelar</button>
            <button class="btn-primary">Guardar Cambios</button>
        </div>
    </main>
</div>
