<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/png" href="/icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVOL-T | Acceso</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="status-bar">
        <div id="dot"></div>
        <span id="net-text">Iniciando...</span>
    </div>
<img src="assets/icon.png" alt="Logo REVOL-T" width="100">
    <div class="auth-container">
        <div id="registro-box">
            <h2>Crear Cuenta REVOL-T</h2>
            <form id="registro-form">
                <input type="email" id="reg-email" placeholder="Correo electrónico" required>
                <input type="password" id="reg-pass" placeholder="Contraseña (mín. 6 caracteres)" required>
                <button type="submit" class="btn-main">Registrarse</button>
            </form>
            <p>¿Ya tienes cuenta? <a href="#" onclick="toggleAuth()">Inicia Sesión</a></p>
        </div>

        <div id="login-box" style="display: none;">
            <h2>Bienvenido a REVOL-T</h2>
            <form id="login-form">
                <input type="email" id="log-email" placeholder="Correo electrónico" required>
                <input type="password" id="log-pass" placeholder="Contraseña" required>
                <button type="submit" class="btn-main login-color">Entrar</button>
            </form>
            <p>¿No tienes cuenta? <a href="#" onclick="toggleAuth()">Regístrate</a></p>
        </div>

        <div id="mensaje-status"></div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
