<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVOL-T | Acceso</title>
    <link rel="stylesheet" href="style-dashboard.css">
</head>
<body>

    <div id="status-bar">
        <div id="dot"></div>
        <span id="net-text">Iniciando...</span>
    </div>

    <img src="icon.png" alt="Logo REVOL-T" width="100" style="display: block; margin: 0 auto;">

    <div class="auth-container">
        <div id="registro-box">
            <h2>Crear Cuenta REVOL-T</h2>
            <input type="email" id="reg-email" placeholder="Correo electrónico">
            <input type="password" id="reg-pass" placeholder="Contraseña">
            <button class="btn-main" id="btn-registrar">Registrarse</button>
            <p>¿Ya tienes cuenta? <a href="#" class="toggle-link">Inicia Sesión</a></p>
        </div>

        <div id="login-box" style="display: none;">
            <h2>Bienvenido a REVOL-T</h2>
            <input type="email" id="log-email" placeholder="Correo electrónico">
            <input type="password" id="log-pass" placeholder="Contraseña">
            <button class="btn-main" id="btn-entrar">Entrar</button>
            <p>¿No tienes cuenta? <a href="#" class="toggle-link">Regístrate</a></p>
        </div>

        <div id="mensaje-status"></div>
    </div>

    <script src="dashboard.html"></script>
</body>
</html>
